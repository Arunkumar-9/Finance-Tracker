<!DOCTYPE html>
<html>
<head>
<title>Personal Finance Tracker</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
transition:.3s;
background:#f4f6f9;
}

.dark-mode{
background:#121212!important;
color:white!important;
}

.dark-card{
background:#1e1e1e!important;
color:white!important;
}

.header-gradient{
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
padding:20px;
border-radius:12px;
}

.summary-card{
border-radius:15px;
transition:.2s;
}

.summary-card:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.list-group-item{
border-radius:10px;
margin-bottom:10px;
border:none;
box-shadow:0 3px 8px rgba(0,0,0,.05);
transition: all 0.3s ease;
}

.list-group-item:hover{
background-color: rgba(0,0,0,0.05);
transform: translateX(5px);
}

.dark-mode .list-group-item{
background-color:#2a2a2a;
color:white;
box-shadow:0 3px 8px rgba(0,0,0,.3);
}

.dark-mode .list-group-item:hover{
background-color: rgba(255,255,255,0.12);
transform: translateX(5px);
}

.dark-mode .list-group-item .text-muted{
color:#b0b0b0!important;
}

</style>
</head>

<body id="body">

<script>

const token=localStorage.getItem("token");

if(!token){
window.location.href="login.html";
}

</script>

<div class="container mt-5">

<div id="mainCard" class="card shadow p-4">

<!-- HEADER -->

<div class="header-gradient d-flex justify-content-between align-items-center">

<div>
<h3><i class="bi bi-wallet2"></i> Personal Finance Tracker</h3>
<small id="welcomeUser"></small>
</div>

<div>

<button onclick="toggleDarkMode()" class="btn btn-outline-light btn-sm me-2" title="Toggle Theme">
<i id="themeIcon" class="bi bi-sun"></i>
</button>

<button onclick="logout()" class="btn btn-danger btn-sm">
<i class="bi bi-box-arrow-right"></i> Logout
</button>

</div>

</div>

<hr>

<!-- ADD TRANSACTION -->

<div class="row g-3">

<div class="col-md-3">
<input type="number" id="amount" class="form-control" placeholder="Amount" title="Enter transaction amount">
</div>

<div class="col-md-3">
<select id="type" class="form-select">
<option value="income">Income</option>
<option value="expense">Expense</option>
</select>
</div>

<div class="col-md-3">

<select id="category" class="form-select">
<option value="" disabled selected>Select Category</option>
<option value="salary">Salary</option>
<option value="food">Food</option>
<option value="rent">Rent</option>
<option value="transport">Transport</option>
<option value="shopping">Shopping</option>
<option value="entertainment">Entertainment</option>
<option value="bills">Bills</option>
<option value="other">Other</option>
</select>

</div>

<div class="col-md-3">
<button onclick="addTransaction()" class="btn btn-primary w-100">
<i class="bi bi-plus-circle"></i> Add
</button>
</div>

</div>

<hr class="my-4">

<!-- SUMMARY -->

<div class="row text-center">

<div class="col-md-4">
<div class="card summary-card bg-success text-white p-4">
<h6>Total Income</h6>
<h4 id="totalIncome">₹0</h4>
</div>
</div>

<div class="col-md-4">
<div class="card summary-card bg-danger text-white p-4">
<h6>Total Expense</h6>
<h4 id="totalExpense">₹0</h4>
</div>
</div>

<div class="col-md-4">
<div class="card summary-card bg-dark text-white p-4">
<h6>Balance</h6>
<h4 id="balance">₹0</h4>
</div>
</div>

</div>

<hr class="my-4">

<!-- FILTER HEADER -->

<h5 class="d-flex justify-content-between align-items-center">

<span>Filter Transactions</span>

<button id="toggleFilterBtn" onclick="toggleFilters()" class="btn btn-sm btn-outline-secondary" title="Toggle Filters">
<i id="toggleIcon" class="bi bi-chevron-down"></i>
</button>

</h5>

<!-- FILTER SECTION -->

<div id="filterSection" style="display: none;">

<div class="row g-3 mb-3">

<div class="col-md-3">
<button class="btn btn-outline-primary w-100" onclick="filterThisMonth()">
<i class="bi bi-calendar-event"></i> This Month
</button>
</div>

<div class="col-md-3">
<button class="btn btn-outline-primary w-100" onclick="filterLastMonth()">
<i class="bi bi-calendar-minus"></i> Last Month
</button>
</div>

<div class="col-md-3">
<input type="date" id="startDate" class="form-control">
</div>

<div class="col-md-3">
<input type="date" id="endDate" class="form-control">
</div>

<div class="col-md-6">
<select id="categoryFilter" class="form-select">
<option value="">All Categories</option>
<option value="salary">Salary</option>
<option value="food">Food</option>
<option value="rent">Rent</option>
<option value="transport">Transport</option>
<option value="shopping">Shopping</option>
<option value="entertainment">Entertainment</option>
<option value="bills">Bills</option>
<option value="other">Other</option>
</select>
</div>

<div class="col-md-6">
<button class="btn btn-info w-100" onclick="applyFilters()">
<i class="bi bi-funnel"></i> Apply Filters
</button>
</div>

<div class="col-md-12">
<button class="btn btn-secondary w-100" onclick="clearFilter()">
<i class="bi bi-arrow-clockwise"></i> Show All Transactions
</button>
</div>

</div>

</div>

<p id="filterStatus" class="text-muted mb-2"></p>

<h4>Transactions</h4>

<ul id="list" class="list-group"></ul>

<div id="loading" class="text-center mt-3" style="display:none;">
<div class="spinner-border text-primary" role="status">
<span class="visually-hidden">Loading...</span>
</div>
</div>

</div>
</div>

<script>

const API_URL="http://127.0.0.1:5000";

/* LOAD USER */

async function loadUser(){

const res=await fetch(`${API_URL}/me`,{
headers:{Authorization:token}
});

const user=await res.json();

document.getElementById("welcomeUser").innerText="Welcome, "+user.name;

}

/* ADD TRANSACTION */

async function addTransaction(){

const amount=document.getElementById("amount").value;
const type=document.getElementById("type").value;
const category=document.getElementById("category").value;

if(!amount||!category){
alert("Fill all fields");
return;
}

await fetch(`${API_URL}/add`,{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:token
},
body:JSON.stringify({amount,type,category})
});

document.getElementById("amount").value="";
document.getElementById("category").value="";

loadTransactions();

}

/* LOAD TRANSACTIONS */

async function loadTransactions(start="",end="",category=""){

document.getElementById("loading").style.display="block";

let url=`${API_URL}/transactions`;

let params=[];

if(start && end){
params.push(`start=${start}`);
params.push(`end=${end}`);
}

if(category){
params.push(`category=${category}`);
}

if(params.length>0){
url+="?"+params.join("&");
}

const res=await fetch(url,{
headers:{Authorization:token}
});

const data=await res.json();

const list=document.getElementById("list");

list.innerHTML="";

let income=0;
let expense=0;

data.forEach(item=>{

const date=new Date(item.date).toLocaleDateString();

if(item.type==="income") income+=Number(item.amount);
else expense+=Number(item.amount);

const icon = item.type === "income" ? '<i class="bi bi-plus-circle text-success me-2"></i>' : '<i class="bi bi-dash-circle text-danger me-2"></i>';

list.innerHTML+=`
<li class="list-group-item d-flex justify-content-between align-items-center">

<div>
${icon}
<b style="color:${item.type==="income"?"green":"red"}">
${item.type.toUpperCase()}
</b> - ₹${item.amount} (${item.category})
<br>
<small class="text-muted">${date}</small>
</div>

<button onclick="deleteTransaction('${item._id}')" class="btn btn-sm btn-danger">
<i class="bi bi-trash"></i>
</button>

</li>
`;

});

document.getElementById("totalIncome").innerText="₹"+income;
document.getElementById("totalExpense").innerText="₹"+expense;
document.getElementById("balance").innerText="₹"+(income-expense);

document.getElementById("loading").style.display="none";

}

/* FILTERS */

function applyFilters(){

const start=document.getElementById("startDate").value;
const end=document.getElementById("endDate").value;
const category=document.getElementById("categoryFilter").value;

document.getElementById("filterStatus").innerText="Filters applied";

loadTransactions(start,end,category);

}

function filterThisMonth(){

const now=new Date();

const start=new Date(now.getFullYear(),now.getMonth(),1)
.toISOString().split("T")[0];

const end=new Date().toISOString().split("T")[0];

document.getElementById("filterStatus").innerText="Showing: This Month";

loadTransactions(start,end);

}

function filterLastMonth(){

const now=new Date();

const start=new Date(now.getFullYear(),now.getMonth()-1,1)
.toISOString().split("T")[0];

const end=new Date(now.getFullYear(),now.getMonth(),0)
.toISOString().split("T")[0];

document.getElementById("filterStatus").innerText="Showing: Last Month";

loadTransactions(start,end);

}

function clearFilter(){

document.getElementById("filterStatus").innerText="Showing: All Transactions";

document.getElementById("startDate").value="";
document.getElementById("endDate").value="";
document.getElementById("categoryFilter").value="";

loadTransactions();

}

/* TOGGLE FILTERS */

function toggleFilters(){

const section=document.getElementById("filterSection");
const toggleIcon=document.getElementById("toggleIcon");

if(section.style.display==="none"){
section.style.display="block";
toggleIcon.className = "bi bi-chevron-up";
}else{
section.style.display="none";
toggleIcon.className = "bi bi-chevron-down";
}

}

/* DELETE */

async function deleteTransaction(id){

if(!confirm("Delete this transaction?")) return;

await fetch(`${API_URL}/delete/${id}`,{
method:"DELETE",
headers:{Authorization:token}
});

loadTransactions();

}

/* DARK MODE */

function toggleDarkMode(){

const body=document.getElementById("body");
const mainCard=document.getElementById("mainCard");
const themeIcon=document.getElementById("themeIcon");

body.classList.toggle("dark-mode");
mainCard.classList.toggle("dark-card");

if(body.classList.contains("dark-mode")){
themeIcon.className = "bi bi-moon";
}else{
themeIcon.className = "bi bi-sun";
}

localStorage.setItem(
"theme",
body.classList.contains("dark-mode")?"dark":"light"
);

}

/* LOGOUT */

function logout(){

localStorage.removeItem("token");
window.location.href="login.html";

}

/* PAGE LOAD */

window.onload=function(){

loadUser();
loadTransactions();

const savedTheme=localStorage.getItem("theme");

if(savedTheme==="dark"){
document.getElementById("body").classList.add("dark-mode");
document.getElementById("mainCard").classList.add("dark-card");
document.getElementById("themeIcon").className = "bi bi-moon";
}

};

</script>

</body>
</html>
