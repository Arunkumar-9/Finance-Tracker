<!DOCTYPE html>
<html>
<head>
  <title>Personal Finance Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
body {
  transition: all 0.3s ease;
  background: #f4f6f9;
}

.dark-mode {
  background-color: #121212 !important;
  color: white !important;
}

.dark-card {
  background-color: #1e1e1e !important;
  color: white !important;
}

.header-gradient {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 20px;
  border-radius: 12px;
}

.summary-card {
  border-radius: 15px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.summary-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.summary-card h4 {
  font-size: 28px;
  font-weight: bold;
}

.list-group-item {
  border-radius: 10px;
  margin-bottom: 10px;
  border: none;
  box-shadow: 0 3px 8px rgba(0,0,0,0.05);
}

.btn-danger {
  border-radius: 20px;
  padding: 4px 12px;
}
</style>
</head>

<body id="body" class="bg-light">

<script>
const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "login.html";
}
</script>

<div class="container mt-5">
  <div id="mainCard" class="card shadow p-4">

    <!-- UPDATED HEADER -->
    <div class="header-gradient d-flex justify-content-between align-items-center">
      <div>
        <h3>Personal Finance Tracker</h3>
        <small id="welcomeUser"></small>
      </div>

      <div>
        <button onclick="toggleDarkMode()" class="btn btn-light btn-sm me-2">
          🌙 / ☀️
        </button>
        <button onclick="logout()" class="btn btn-danger btn-sm">
          Logout
        </button>
      </div>
    </div>

    <hr>

    <div class="row g-3">
      <div class="col-md-3">
        <input type="number" id="amount" class="form-control" placeholder="Amount">
      </div>

      <div class="col-md-3">
        <select id="type" class="form-select">
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </div>

      <div class="col-md-3">
        <input type="text" id="category" class="form-control" placeholder="Category">
      </div>

      <div class="col-md-3">
        <button type="button" onclick="addTransaction()" class="btn btn-primary w-100">
          Add
        </button>
      </div>
    </div>

    <hr class="my-4">

    <div class="row text-center mt-4">
     <div class="col-md-4">
      <div class="card summary-card bg-success text-white p-4">
        <h6>Total Income</h6>
        <h4 id="totalIncome">₹0</h4>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card summary-card bg-danger text-white p-4">
        <h6>Total Expense</h6>
        <h4 id="totalExpense">₹0</h4>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card summary-card bg-dark text-white p-4">
        <h6>Balance</h6>
        <h4 id="balance">₹0</h4>
      </div>
    </div>
  </div>

    <hr class="my-4">

    <h4>Transactions</h4>
    <ul id="list" class="list-group"></ul>

  </div>
</div>

<script>

const API_URL = "http://127.0.0.1:5000";

/* ================= LOAD USER ================= */

async function loadUser() {
  try {
    const res = await fetch(`${API_URL}/me`, {
      headers: {
        "Authorization": token
      }
    });

    if (!res.ok) {
      throw new Error("Failed to load user");
    }

    const user = await res.json();

    document.getElementById("welcomeUser").innerText =
      "Welcome, " + user.name;

  } catch (error) {
    console.error("User load error:", error);
  }
}

/* ================= ADD TRANSACTION ================= */

async function addTransaction() {
  const amount = document.getElementById("amount").value;
  const type = document.getElementById("type").value;
  const category = document.getElementById("category").value;

  if (!amount || !category) {
    alert("Please fill all fields");
    return;
  }

  try {
    const res = await fetch(`${API_URL}/add`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": token
      },
      body: JSON.stringify({ amount, type, category })
    });

    if (!res.ok) throw new Error();

    document.getElementById("amount").value = "";
    document.getElementById("category").value = "";

    loadTransactions();

  } catch {
    alert("Error adding transaction");
  }
}

/* ================= LOAD TRANSACTIONS ================= */

async function loadTransactions() {
  try {
    const res = await fetch(`${API_URL}/transactions`, {
      headers: {
        "Authorization": token
      }
    });

    if (!res.ok) throw new Error();

    const data = await res.json();

    const list = document.getElementById("list");
    list.innerHTML = "";

    let income = 0;
    let expense = 0;

    data.forEach(item => {
      if (item.type === "income") income += Number(item.amount);
      else expense += Number(item.amount);

      list.innerHTML += `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          ${item.type.toUpperCase()} - ₹${item.amount} (${item.category})
          <button onclick="deleteTransaction('${item._id}')" class="btn btn-sm btn-danger">
            Delete
          </button>
        </li>`;
    });

    document.getElementById("totalIncome").innerText = "₹" + income;
    document.getElementById("totalExpense").innerText = "₹" + expense;
    document.getElementById("balance").innerText = "₹" + (income - expense);

  } catch {
    document.getElementById("list").innerHTML =
      `<li class="list-group-item text-danger">Error loading transactions</li>`;
  }
}

/* ================= DELETE ================= */

async function deleteTransaction(id) {
  try {
    const res = await fetch(`${API_URL}/delete/${id}`, {
      method: "DELETE",
      headers: {
        "Authorization": token
      }
    });

    if (!res.ok) throw new Error();

    loadTransactions();

  } catch {
    alert("Error deleting transaction");
  }
}

/* ================= DARK MODE ================= */

function toggleDarkMode() {
  const body = document.getElementById("body");
  const mainCard = document.getElementById("mainCard");

  body.classList.toggle("dark-mode");
  mainCard.classList.toggle("dark-card");

  localStorage.setItem("theme",
    body.classList.contains("dark-mode") ? "dark" : "light"
  );
}

/* ================= LOGOUT ================= */

function logout() {
  localStorage.removeItem("token");
  window.location.href = "login.html";
}

/* ================= PAGE LOAD ================= */

window.onload = function() {
  loadUser();           // 🔥 NEW
  loadTransactions();

  const savedTheme = localStorage.getItem("theme");
  if (savedTheme === "dark") {
    document.getElementById("body").classList.add("dark-mode");
    document.getElementById("mainCard").classList.add("dark-card");
  }
};

</script>

</body>
</html>
