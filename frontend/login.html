<!DOCTYPE html>
<html>
<head>
  <title>Login - Finance Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
  <div class="card p-4 shadow col-md-6 mx-auto">

    <h3 class="text-center mb-4">🔐 Login</h3>

    <input type="email" id="email" class="form-control mb-3" placeholder="Email">
    <input type="password" id="password" class="form-control mb-3" placeholder="Password">

    <button class="btn btn-primary w-100 mb-3" onclick="login()">Login</button>

    <p class="text-center">
      Don't have an account?
      <a href="register.html">Register</a>
    </p>

    <p id="message" class="text-center text-danger"></p>

  </div>
</div>

<script>
const API_URL = "http://127.0.0.1:5000";

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch(`${API_URL}/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (data.token) {
    localStorage.setItem("token", data.token);
    window.location.href = "Tracker.html";
  } else {
    document.getElementById("message").innerText = data.message;
  }
}
</script>

</body>
</html>
