<!DOCTYPE html>
<html>
<head>
  <title>Register - Finance Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
  <div class="card p-4 shadow col-md-6 mx-auto">

    <h3 class="text-center mb-4">📝 Create Account</h3>

    <input type="text" id="name" class="form-control mb-3" placeholder="Full Name">
    <input type="email" id="email" class="form-control mb-3" placeholder="Email">
    <input type="password" id="password" class="form-control mb-3" placeholder="Password">

    <button class="btn btn-success w-100 mb-3" onclick="register()">Register</button>

    <p class="text-center">
      Already have an account?
      <a href="http://127.0.0.1:5500/login.html">Login</a>
    </p>

    <p id="message" class="text-center text-danger"></p>

  </div>
</div>

<script>
const API_URL = "http://127.0.0.1:5000";

async function register() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!name || !email || !password) {
    document.getElementById("message").innerText = "Please fill all fields";
    return;
  }

  try {
    const res = await fetch(`${API_URL}/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password })
    });

    const data = await res.json();

    document.getElementById("message").innerText = data.message;

    if (res.ok) {
      setTimeout(() => {
        window.location.href = "http://127.0.0.1:5500/login.html";
      }, 1000);
    }

  } catch (error) {
    document.getElementById("message").innerText = "Server error. Try again.";
    console.error("Register error:", error);
  }
}
</script>

</body>
</html>
